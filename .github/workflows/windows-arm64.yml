# Windows on ARM (#61): package the ARM64 release the way release.yml does (cross-compiled on an
# x64 runner, unsigned here), then install that MSI on a Windows 11 ARM64 runner and run it, and
# run the test suite natively on ARM64.
name: Windows ARM64

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - "**/build.rs"
      - .github/workflows/windows-arm64.yml
      - packaging/windows/**
  schedule:
    - cron: "41 4 * * 1" # weekly, so drift in the runner images shows up
  workflow_dispatch:

concurrency:
  group: windows-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-arm64:
    # SHA-pinned: a personal fork does not track craft-common-actions' moving `main`; bump this
    # ref deliberately after reading the shared workflow's changes.
    uses: storytold/craft-common-actions/.github/workflows/windows-arm64.yml@be6bbf3ca5a5de466786908b3986163da7c05314
    with:
      app-name: pdfcraft
      app-dir: PdfCraft
