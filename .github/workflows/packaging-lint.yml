# Quick static checks for the release pipeline (seconds, no Rust build): workflow syntax,
# packaging shell/PowerShell scripts, and the Linux desktop/AppStream/Flatpak metadata.
name: Packaging lint

on:
  push:
    branches: [main, release]
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  pull_request:
    paths: [".github/workflows/**", "packaging/**", "assets/app-icon/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packaging-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    # SHA-pinned: a personal fork does not track craft-common-actions' moving `main`; bump this
    # ref deliberately after reading the shared workflow's changes.
    uses: storytold/craft-common-actions/.github/workflows/packaging-lint.yml@be6bbf3ca5a5de466786908b3986163da7c05314
