# Builds and tests the workspace on FreeBSD, inside a FreeBSD VM on a Linux runner
# (GitHub has no FreeBSD runners). GPU tests skip themselves when the VM has no adapter.
name: FreeBSD

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - "**/Cargo.toml"
      - .github/workflows/freebsd.yml
      - packaging/freebsd/**
  workflow_dispatch:

concurrency:
  group: freebsd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  freebsd:
    # SHA-pinned: a personal fork does not track craft-common-actions' moving `main`; bump this
    # ref deliberately after reading the shared workflow's changes.
    uses: storytold/craft-common-actions/.github/workflows/freebsd.yml@be6bbf3ca5a5de466786908b3986163da7c05314
    with:
      craft-fonts-ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
