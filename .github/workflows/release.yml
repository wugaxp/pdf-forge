name: Release

# Builds every release artefact and drafts a GitHub release through the suite's shared release
# workflow in craft-common-actions. This is a personal fork:
# - runs are dispatched by hand from `main`, because the shared workflow *requires* the suite's
#   Apple/Windows/Azure signing secrets on `refs/heads/release` and a personal fork has none;
# - no signing secrets are passed (all of them are optional there), so the artefacts are unsigned
#   until the maintainer adds them to a `release` environment and lists them below.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version override for a test run, e.g. 0.2.0-rc.1 (empty: Cargo.toml)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # SHA-pinned: a personal fork does not track craft-common-actions' moving `main`; bump this
    # ref deliberately after reading the shared workflow's changes.
    uses: storytold/craft-common-actions/.github/workflows/release.yml@be6bbf3ca5a5de466786908b3986163da7c05314
    with:
      # The artefacts and binaries keep the technical name `pdfcraft`; the display name is the
      # fork's brand (README, "Known limits").
      app-name: pdfcraft
      app-title: PDF Forge
      craft-fonts-ref: 3d9ab3a132ed0eff457e424226a435a901da30d3
      version: ${{ inputs.version }}